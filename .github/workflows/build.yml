name: Build ZN-Assistant

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize line endings
        run: |
          find . -type f \( -name "*.sh" -o -name "module.prop" -o -name "system.prop" -o -path "./META-INF/*" \) -print0 | xargs -0 -r sed -i 's/\r$//'

      - name: Set executable permissions
        run: |
          for f in customize.sh post-fs-data.sh service.sh; do
            if [ -f "$f" ]; then
              chmod +x "$f"
            fi
          done

          if [ -f META-INF/com/google/android/update-binary ]; then
            chmod +x META-INF/com/google/android/update-binary
          fi

      - name: Validate module.prop
        id: info
        run: |
          set -e

          if [ ! -f module.prop ]; then
            echo "::error::module.prop tidak ditemukan di root repository!"
            exit 1
          fi

          MODULE_ID=$(awk -F= '/^id=/{gsub(/\r/, "", $2); print $2; exit}' module.prop)
          MODULE_NAME=$(awk -F= '/^name=/{gsub(/\r/, "", $2); print $2; exit}' module.prop)
          MODULE_VERSION=$(awk -F= '/^version=/{gsub(/\r/, "", $2); print $2; exit}' module.prop)
          MODULE_VERSION_CODE=$(awk -F= '/^versionCode=/{gsub(/\r/, "", $2); print $2; exit}' module.prop)

          if [ -z "$MODULE_ID" ]; then
            echo "::error::Field id= kosong di module.prop!"
            exit 1
          fi

          if [ -z "$MODULE_VERSION" ]; then
            echo "::error::Field version= kosong di module.prop!"
            exit 1
          fi

          if [ -z "$MODULE_VERSION_CODE" ]; then
            echo "::error::Field versionCode= kosong di module.prop!"
            exit 1
          fi

          case "$MODULE_VERSION_CODE" in
            ''|*[!0-9]*)
              echo "::error::versionCode harus berupa angka!"
              exit 1
              ;;
          esac

          ZIP_NAME="${MODULE_ID}-${MODULE_VERSION}.zip"

          echo "MODULE_ID=$MODULE_ID" >> $GITHUB_ENV
          echo "MODULE_NAME=$MODULE_NAME" >> $GITHUB_ENV
          echo "MODULE_VERSION=$MODULE_VERSION" >> $GITHUB_ENV
          echo "MODULE_VERSION_CODE=$MODULE_VERSION_CODE" >> $GITHUB_ENV
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

          echo "Building: $MODULE_NAME $MODULE_VERSION"
          echo "Artifact: $ZIP_NAME"

      - name: Package module ZIP
        run: |
          set -e

          rm -f "${ZIP_NAME}"

          zip -r "${ZIP_NAME}" . \
            -x ".git/*" \
            -x ".github/*" \
            -x "README.md" \
            -x "LICENSE" \
            -x ".gitattributes"

          echo ""
          echo "Isi ZIP:"
          unzip -l "${ZIP_NAME}"

          if ! unzip -l "${ZIP_NAME}" | grep -q "module.prop"; then
            echo "::error::module.prop tidak ditemukan di dalam ZIP!"
            exit 1
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "${{ env.MODULE_NAME }} ${{ env.MODULE_VERSION }}"
          body: |
            ## ${{ env.MODULE_NAME }} ${{ env.MODULE_VERSION }}

            Companion module untuk Zygisk Next v1.5.2.

            ### Fitur
            - Optimize Zygisk Next root hiding
            - Remove Magisk/Zygisk trace logs
            - Clean suspicious files in `/data/local/tmp`
            - Spoof bootloader/root related properties
            - Compatible with Magisk Alpha 30700 / 31000+

            ### Install
            1. Install Zygisk Next v1.5.2+
            2. Disable built-in Magisk Zygisk
            3. Install module ini dari Magisk app
            4. Reboot

            ### Note
            Gunakan dengan risiko sendiri. Backup sebelum install.
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
