name: Build ZN-Assistant

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sanitize text files
        run: |
          set -euo pipefail

          # Remove BOM and CRLF from important text files.
          find . -type f \( \
            -name "*.sh" \
            -o -name "*.prop" \
            -o -name "*.md" \
            -o -name ".gitattributes" \
            -o -name ".gitignore" \
            -o -path "./META-INF/*" \
          \) -print0 | xargs -0 -r sed -i '1s/^\xEF\xBB\xBF//; s/\r$//'

      - name: Ensure required files exist
        run: |
          set -euo pipefail

          REQUIRED_FILES="
          module.prop
          customize.sh
          post-fs-data.sh
          service.sh
          system.prop
          META-INF/com/google/android/update-binary
          META-INF/com/google/android/updater-script
          "

          for FILE in $REQUIRED_FILES; do
            if [ ! -f "$FILE" ]; then
              echo "::error::Required file missing: $FILE"
              exit 1
            fi
          done

      - name: Set executable permissions
        run: |
          set -euo pipefail

          chmod +x customize.sh
          chmod +x post-fs-data.sh
          chmod +x service.sh
          chmod +x META-INF/com/google/android/update-binary

      - name: Read and validate module.prop
        id: info
        run: |
          set -euo pipefail

          MODULE_ID=$(sed -n 's/^id=//p' module.prop | head -n1)
          MODULE_NAME=$(sed -n 's/^name=//p' module.prop | head -n1)
          MODULE_VERSION=$(sed -n 's/^version=//p' module.prop | head -n1)
          MODULE_VERSION_CODE=$(sed -n 's/^versionCode=//p' module.prop | head -n1)

          if [ -z "$MODULE_ID" ]; then
            echo "::error::Field id= is empty in module.prop"
            exit 1
          fi

          if [ -z "$MODULE_NAME" ]; then
            echo "::error::Field name= is empty in module.prop"
            exit 1
          fi

          if [ -z "$MODULE_VERSION" ]; then
            echo "::error::Field version= is empty in module.prop"
            exit 1
          fi

          if [ -z "$MODULE_VERSION_CODE" ]; then
            echo "::error::Field versionCode= is empty in module.prop"
            exit 1
          fi

          case "$MODULE_VERSION_CODE" in
            ''|*[!0-9]*)
              echo "::error::versionCode must be numeric"
              exit 1
              ;;
          esac

          ZIP_NAME="${MODULE_ID}-${MODULE_VERSION}.zip"

          echo "MODULE_ID=$MODULE_ID" >> "$GITHUB_ENV"
          echo "MODULE_NAME=$MODULE_NAME" >> "$GITHUB_ENV"
          echo "MODULE_VERSION=$MODULE_VERSION" >> "$GITHUB_ENV"
          echo "MODULE_VERSION_CODE=$MODULE_VERSION_CODE" >> "$GITHUB_ENV"
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"

          echo "Building: $MODULE_NAME $MODULE_VERSION"
          echo "Artifact: $ZIP_NAME"

      - name: Stage module files
        run: |
          set -euo pipefail

          rm -rf staging
          mkdir -p staging

          cp -a module.prop staging/
          cp -a customize.sh staging/
          cp -a post-fs-data.sh staging/
          cp -a service.sh staging/
          cp -a system.prop staging/
          cp -a META-INF staging/

          # Optional files, copied only if present
          for ITEM in sepolicy.rule boot-completed.sh action.sh webui update.json; do
            if [ -e "$ITEM" ]; then
              cp -a "$ITEM" staging/
            fi
          done

          chmod +x staging/customize.sh
          chmod +x staging/post-fs-data.sh
          chmod +x staging/service.sh
          chmod +x staging/META-INF/com/google/android/update-binary

      - name: Package module ZIP
        run: |
          set -euo pipefail

          rm -f "$ZIP_NAME"

          cd staging

          FILES=(
            module.prop
            customize.sh
            post-fs-data.sh
            service.sh
            system.prop
            META-INF
          )

          for ITEM in sepolicy.rule boot-completed.sh action.sh webui update.json; do
            if [ -e "$ITEM" ]; then
              FILES+=("$ITEM")
            fi
          done

          zip -r "../$ZIP_NAME" "${FILES[@]}"

          cd ..

          echo ""
          echo "ZIP contents:"
          unzip -l "$ZIP_NAME"

          # Reject ZIP if it contains ./module.prop
          if unzip -l "$ZIP_NAME" | grep -q '\./module\.prop'; then
            echo "::error::ZIP contains ./module.prop. Invalid ZIP structure."
            exit 1
          fi

          # Verify required files are inside ZIP
          for REQUIRED in \
            module.prop \
            customize.sh \
            post-fs-data.sh \
            service.sh \
            system.prop \
            META-INF/com/google/android/update-binary \
            META-INF/com/google/android/updater-script
          do
            if ! unzip -l "$ZIP_NAME" | grep -q "$REQUIRED"; then
              echo "::error::Required file missing inside ZIP: $REQUIRED"
              exit 1
            fi
          done

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "${{ env.MODULE_NAME }} ${{ env.MODULE_VERSION }}"
          body: |
            ## ${{ env.MODULE_NAME }} ${{ env.MODULE_VERSION }}

            Companion module untuk Zygisk Next v1.5.2.

            ### Fitur
            - Optimize Zygisk Next root hiding
            - Remove Magisk/Zygisk trace logs
            - Clean suspicious files in `/data/local/tmp`
            - Spoof bootloader/root related properties
            - Compatible with Magisk Alpha 30700 / 31000+

            ### Install
            1. Install Zygisk Next v1.5.2+
            2. Disable built-in Magisk Zygisk
            3. Install module ini dari Magisk app
            4. Reboot

            ### Note
            Gunakan dengan risiko sendiri. Backup sebelum install.
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
